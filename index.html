<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de média escolar</title>
</head>

<body>

    <header>
        <h1>Calculadora de média escolar</h1>
        <p>Calcule aqui as notas dos seus alunos!</p>
    </header>

    <main>

        <section>
            <label for="nota1">Nota 1:</label>
            <input id="nota1" name="nota1" type="number" placeholder="Ex: 8.5" required>

            <label for="nota2">Nota 2:</label>
            <input id="nota2" name="nota2" type="number" placeholder="Ex: 7" required>

            <label for="nota3">Nota 3:</label>
            <input id="nota3" name="nota3" type="number" placeholder="Ex: 9.3" required>

            <button type="button" onclick="calcularMedia()">Calcular</button>
            <button type="button" onclick="limparCampos()">Limpar campos</button>
        </section>

        <section>
            <h2>Resultado</h2>
            <p id="media"></p>
            <p id="resultado"></p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
