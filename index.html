<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de média escolar</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Cinzel:wght@400..900&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Righteous&family=Sarala:wght@400;700&family=Sora:wght@100..800&family=Teko:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="card">

        <header>
            <h1>Calculadora de média escolar</h1>

            <p>Calcule aqui as notas dos seus alunos!</p>
        </header>

        <main>

            <section>
                <label for="nota1">Nota 1:</label>
                <input id="nota1" name="nota1" type="number" placeholder="Ex: 8.5" required>

                <label for="nota2">Nota 2:</label>
                <input id="nota2" name="nota2" type="number" placeholder="Ex: 7" required>

                <label for="nota3">Nota 3:</label>
                <input id="nota3" name="nota3" type="number" placeholder="Ex: 9.3" required>

                <button type="button" id="calcular">Calcular</button>
                <button type="reset" id="limpar">Limpar campos</button>
            </section>

            <section id="resultadoCampo">
                <h2>Resultado</h2>
                <p id="media"></p>
                <p id="resultado"></p>
            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
